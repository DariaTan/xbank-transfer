# Run parameters for src/training/train_coles.py.
n_clients: null   # cap for a quick debug run; null uses all clients
max_seq_len: 500
max_epochs: 100
patience: 5
valid_frac: 0.05
batch_size: 256
hidden_size: 128
embedding_dim: 32
num_layers: 2
seed: 0
# infer_coles.py / infer_mbd.py ONLY -- always the xbank-pretrained
# checkpoint, since both scripts run frozen zero-shot inference against
# an xbank-pretrained model by design. train_coles.py no longer reads
# this key (updated 2026-09-14): it derives its own checkpoint_dir from
# whichever --data-config is passed (.../<data_config's name>_source/coles),
# so pretraining on MBD never collides with or depends on this value.
checkpoint_dir: /app/data/checkpoints/xbank_source/coles
